name: Active Record head

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_cruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version: [ 3.3, 3.4, '4.0', head ]
    env:
      BUNDLE_GEMFILE: gemfiles/activerecord_head.gemfile
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      id: setup_ruby
      continue-on-error: true
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true
    - name: Run tests
      if: steps.setup_ruby.outcome == 'success'
      id: run_tests
      continue-on-error: true
      run: bundle exec rspec
    - name: Report setup failure
      if: steps.setup_ruby.outcome == 'failure'
      run: |
        echo "::warning title=Tests skipped::Ruby setup or dependency installation failed for Active Record head."
        exit 1
    - name: Report test failure
      if: steps.setup_ruby.outcome == 'success' && steps.run_tests.outcome == 'failure'
      run: |
        echo "::warning title=Tests failed::Tests failed for Active Record head."
        exit 1
  test_jruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/jruby_activerecord_head.gemfile
      JRUBY_OPTS: --debug
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      id: setup_ruby
      continue-on-error: true
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: jruby
        bundler-cache: true
    - name: Run tests
      id: run_tests
      if: steps.setup_ruby.outcome == 'success'
      continue-on-error: true
      run: bundle exec rspec
    - name: Report setup failure
      if: steps.setup_ruby.outcome == 'failure'
      run: |
        echo "::warning title=Tests skipped::Ruby setup or dependency installation failed for Active Record head."
        exit 1
    - name: Report test failure
      if: steps.setup_ruby.outcome == 'success' && steps.run_tests.outcome == 'failure'
      run: |
        echo "::warning title=Tests failed::Tests failed for Active Record head."
        exit 1
